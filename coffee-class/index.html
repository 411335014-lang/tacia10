<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公主的女僕咖啡教室｜咖啡新手入門</title><style>:root{--cream:#faf5eb;--brown:#49342d;--purple:#d9cbe8;--muted:#776963;--line:#ded3c7}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--brown);font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}header{display:flex;gap:24px;align-items:center;padding:22px 5vw;border-bottom:1px solid var(--line);font-size:13px}.brand{letter-spacing:2px;font-weight:800;color:inherit;text-decoration:none}header span{flex:1;color:var(--muted)}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:30px;background:transparent;color:inherit;padding:10px 18px}button:hover,button:focus-visible{background:var(--purple)}button:disabled{opacity:.35;cursor:default}main{max-width:1200px;margin:auto;padding:5vh 6vw 110px}.slide{display:none;min-height:65vh}.slide.active{display:flex;flex-direction:column;animation:appear .22s ease-out}.eyebrow{color:#846491;font-size:13px;font-weight:700;letter-spacing:2px;margin:0 0 20px}h1{font-size:clamp(32px,4.8vw,64px);line-height:1.2;letter-spacing:-1px;max-width:950px;margin:0 0 24px}h2{font-size:24px;margin:0 0 12px}p,li{font-size:clamp(17px,1.8vw,23px);line-height:1.75}p{margin:0 0 16px}.lead{max-width:850px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:24px;border:1px solid var(--line);border-radius:18px;background:#fffaf3}.card p{font-size:18px;margin:0}.note{background:#e9e0f1;padding:16px 22px;border-radius:12px;font-size:17px;margin-top:22px}table{border-collapse:collapse;width:100%;font-size:19px}th,td{text-align:left;padding:15px;border-bottom:1px solid var(--line);line-height:1.5}th{background:#e9e0f1}.source{font-size:12px;margin-top:auto;padding-top:30px;color:var(--muted)}.source a{color:inherit}.big{font-size:clamp(44px,7vw,90p <body><header><a class="brand" href="#1">PRINCESS COFFEE CLASS</a><span>咖啡新手入門 · 教學簡報</span><button id="print">列印／PDF</button></header><main id="deck" aria-live="polite"></main><footer><button id="prev" aria-label="上一頁">← 上一頁</button><span id="count"></span><input id="jump" type="range" min="1" aria-label="切換頁面"><button id="next" aria-label="下一頁">下一頁 →</button></footer><script>const lessons=[
['START HERE','公主的女僕咖啡教室',`<span class="tag">咖啡新手入門</span><p class="lead">從看懂豆單，到理解濃縮與奶泡。<br>風味看條件，參數是起點，調整留紀錄。</p><div class="note">使用左右方向鍵、下方按鈕或進度條換頁。測驗可點開答案；手機可上下捲動閱讀。</div>`,0],
['LEARNING MAP','學完可以理解什麼？',`<ol class="step"><li>看懂豆種與產地的風味線索</li><li>比較焙度與烘焙過程的影響</li><li>理解濃縮原理，計算並記錄配方</li><li>分辨拿鐵、卡布奇諾與合適奶泡</li><li>拆解酸、苦與咖啡因迷思</li></ol>`,0],
['01 · COFFEE CHERRY','咖啡豆是什麼？',`<div class="grid"><div class="card"><svg viewBox="0 0 400 240" role="img" aria-label="咖啡果實剖面教學示意：紅色果肉包覆內部兩顆種子"><ellipse cx="200" cy="120" rx="125" ry="100" fill="#b56c71"/><ellipse cx="200" cy="120" rx="102" ry="79" fill="#efcbb5"/><ellipse cx="163" cy="120" rx="30" ry="58" fill="#dfd4aa"/><ellipse cx="237" cy="120" rx="30" ry="58" fill="#dfd4aa"/><path d="M163 70 Q145 120 163 170 M237 70 Q255 120 237 170" stroke="#7b664c" fill="none" stroke-width="4"/><text x="200" y="233" text-anchor="middle" font-size="16" fill="#49342d">示意圖：非精確比例</text></svg></div><div><h2>果實裡的種子</h2><p>咖啡豆是咖啡果實內的種子。商店裡的褐色熟豆，是經處理、乾燥與烘焙後的樣子。</p><p>不是果實天生就長出烘好的豆子。</p></div></div>`,1],
['01 · SPECIES','豆種有哪些差異？',`<table><tr><th>比較</th><th>Arabica 阿拉比卡</th><th>Robusta 羅布斯塔</th></tr><tr><td>常見風味</td><td>較溫和、香氣較細緻</td><td>較強烈，苦感常較明顯</td></tr><tr><td>豆子咖啡因傾向</td><td>一般較低</td><td>一般較高</td></tr><tr><td>栽培</td><td>偏好較溫和環境</td><td>較能適應炎熱環境</td></tr></table><div class="note">這是常見趨勢，不是品質排名，也不能由豆種直接算出每杯咖啡因。</div>`,1],
['01 · ORIGIN','不同產地，風味有何不同？',`<div class="grid"><div class="card"><h2>衣索比亞</h2><p>花香、果香；部分批次酸感鮮明。</p></div><div class="card"><h2>肯亞</h2><p>鮮明果酸、濃郁香氣。</p></div><div class="card"><h2>巴西</h2><p>較柔和酸感、甜感。</p></div><div class="card"><h2>瓜地馬拉</h2><p>巧克力、香料或柑橘調性。</p></div></div><div class="note">氣候、土壤、海拔等共同影響風味。國名不是味道保證，仍看批次與處理；描述是感官聯想，不表示添加食材。</div>`,1],
['02 · ROAST DEGREE','烘焙如何改變風味？',`<p class="lead">加熱引發梅納反應等變化，形成香氣與滋味。以下為條件接近時的常見傾向。</p><div class="grid three"><div class="card"><h2>淺焙 Light</h2><p>較保留原有香氣，酸感常較鮮明。</p></div><div class="card"><h2>中焙 Medium</h2><p>原有風味與烘焙調性並存。</p></div><div class="card"><h2>深焙 Dark</h2><p>烘焙調性突出，苦感常更明顯。</p></div></div><div class="note">中焙不保證最甜；深焙也不代表每杯更濃厚。口感還受沖煮濃度等因素影響。</div>`,2],
['02 · DEGREE & PROFILE','都叫中焙，為什麼味道不同？',`<div class="grid"><div class="card"><h2>焙度 Roast degree</h2><p>最後烘到多深，常以顏色作指標。</p></div><div class="card"><h2>烘焙曲線 Roast profile</h2><p>過程中的溫度與時間安排。</p></div></div><p style="margin-top:24px">即使顏色相近，時間安排仍可能改變風味；不同店家的焙度標示也可能不同。</p><div class="note">不把「延長發展一定更甜」當公式。淺焙能做義式，深焙也能手沖，配方要配合豆子。</div>`,2],
['03 · ESPRESSO','Espresso 是什麼？',`<p class="lead">加壓熱水通過細研磨的咖啡粉餅，得到份量較小、濃度較高的咖啡。</p><div class="grid"><div class="card"><svg viewBox="0 0 400 230" role="img" aria-label="熱水經壓力通過粉餅，咖啡液流入杯中"><text x="200" y="25" text-anchor="middle" font-size="20" fill="#49342d">加壓熱水</text><path d="M140 40 V80 M200 40 V80 M260 40 V80" stroke="#9c82b3" stroke-width="8"/><rect x="85" y="86" width="230" height="45" rx="8" fill="#745144"/><text x="200" y="115" text-anchor="middle" font-size="18" fill="#fff">細研磨咖啡粉餅</text><path d="M165 137 V164 M200 137 V164 M235 137 V164" stroke="#745144" stroke-width="5"/><path d="M130 174 H270 L255 215 H145 Z" fill="#d9cbe8"/><text x="200" y="202" text-anchor="middle" font-size="16" fill="#49342d">杯中咖啡液</text></svg></div><div class="card"><h2>它是沖煮方式</h2><p>不是豆種，也不限深焙。粉餅準備與配方都會影響結果。</p></div></div>`,3],
['03 · BREW RECIPE','看懂一份濃縮配方',`<div class="recipe"><div>粉量 Dose：18 g</div><span>→</span><div>液重 Yield：36 g</div></div><p class="big">粉液比 1 : 2</p><p>36 ÷ 18 = 2。液重是杯中咖啡液，不是注入水量。</p><div class="note">練習示例：約 25–30 秒，從啟動計時含預浸；約 93°C、常見約 9 bar，均依設備與配方調整。從第一滴計時的數值不能直接比較；g 不等於 ml。</div>`,3],
['03 · WORKFLOW','一杯濃縮怎麼做？',`<div class="grid three"><div class="card"><h2>01 預熱</h2><p>機器與把手就緒，粉碗清潔乾燥。</p></div><div class="card"><h2>02 秤粉</h2><p>研磨，確認符合粉碗與配方。</p></div><div class="card"><h2>03 布粉填壓</h2><p>分布均勻、表面平整。</p></div><div class="card"><h2>04 萃取</h2><p>裝好把手，啟動並計時。</p></div><div class="card"><h2>05 秤液試喝</h2><p>記液重、時間與味道。</p></div><div class="card"><h2>06 清潔記錄</h2><p>依手冊清潔，保留配方。</p></div></div>`,3],
['03 · BAR SCENARIO','萃取太快，怎麼調整？',`<p>假設目標是 18 g → 36 g，今天只用 18 秒，味道又薄又尖酸。</p><ol class="step"><li>核對粉量、液重、計時與布粉是否一致</li><li>操作穩定後小幅磨細，其他條件維持</li><li>再記錄與試喝，確認是否改善</li></ol><div class="note">虛構示例。若出液不均，先回查粉餅準備；通道效應是水偏走低阻力路徑而萃取不均。不是酸就一定磨細。</div>`,3],
['04 · MICROFOAM','細緻奶泡怎麼形成？',`<div class="grid three"><div class="card"><h2>進氣</h2><p>尖端靠近液面，適度引入空氣。</p></div><div class="card"><h2>混合</h2><p>形成旋轉，讓氣泡與液體融合。</p></div><div class="card"><h2>控溫</h2><p>用溫度計，依產品與手冊停止。</p></div></div><p style="margin-top:22px">牛奶蛋白質有助穩定氣泡。微奶泡 Microfoam 應細緻、有光澤、能流動。</p><div class="note">先排冷凝水；先關蒸氣再移缸，依手冊清潔排氣。原稿與設備手冊溫度範圍不同，本課不設產品通用值；避免接觸蒸氣與高溫尖端。</div>`,4],
['04 · LATTE & CAPPUCCINO','拿鐵與卡布奇諾差在哪？',`<table><tr><th>比較</th><th>拿鐵 Latte</th><th>卡布奇諾 Cappuccino</th></tr><tr><td>牛奶</td><td>通常較多</td><td>通常相對較少</td></tr><tr><td>奶泡</td><td>較薄、細緻融合</td><td>泡沫口感通常更明顯</td></tr><tr><td>口感</td><td>奶感較突出、柔和</td><td>咖啡與泡沫存在感較強</td></tr><tr><td>杯量</td><td>常見較大</td><td>常見較小</td></tr></table><div class="note">依店內配方為準。卡布奇諾不必一律 1:1:1；奶泡不是越厚越好。</div>`,4],
['04 · BAR SCENARIO','奶泡太厚怎麼辦？',`<p>虛構示例：拿鐵奶泡像一團，倒不出流動感。</p><ol class="step"><li>檢查是否進氣太久、旋轉不足</li><li>下一缸先減少進氣，觀察融合</li><li>及時旋轉與使用，記錄質地變化</li></ol><div class="note">不要一直加熱消泡。植物奶配方與表現不同，依產品說明調整，不能全部套用同一設定。</div>`,4],
['05 · CAFFEINE','喝起來淡，咖啡因就少嗎？',`<div class="grid"><div class="card"><h2>濃度</h2><p>每毫升含多少咖啡因。</p></div><div class="card"><h2>總量</h2><p>整杯合計含多少咖啡因。</p></div></div><div class="recipe" style="margin-top:22px"><div>同一份 Espresso</div><span>＋</span><div>水／牛奶</div></div><p style="margin-top:18px"><strong>加入不含咖啡因的液體，濃度降低，原有總量不被移除。</strong></p><div class="note">不同商品仍看濃縮份數與配方；Decaf 仍可能有少量咖啡因。</div>`,5],
['05 · FAQ & TROUBLESHOOTING','酸與苦一定是問題嗎？',`<div class="grid"><div class="card"><h2>酸不一定失敗</h2><p>清爽協調可能是原有風味；尖銳單薄可查操作。</p></div><div class="card"><h2>苦不等於咖啡因高</h2><p>先查烘焙風格、配方及操作一致性。</p></div></div><p style="margin-top:24px">描述問題 → 核對配方 → 檢查操作 → 一次改一個變因 → 再試喝記錄。</p><div class="note">味道是線索，不是變質或萃取率診斷。異常或霉斑不要靠試喝確認安全。</div>`,5],
['CHECK YOUR UNDERSTANDING','換你判斷看看',`<details><summary>① 同豆種、同產地，味道一定相同？</summary><p>不一定，批次、處理與後續製作仍可能不同。</p></details><details><summary>② 中焙一定最甜，而且只能手沖？</summary><p>都不是。風味受多項條件影響，沖煮方式也不被焙度限制。</p></details><details><summary>③ 18 g 粉得到 45 g 液，粉液比多少？</summary><p>1:2.5，因為 45 ÷ 18 = 2.5。</p></details><details><summary>④ 拿鐵奶泡越厚越好？</summary><p>不是，重點是符合飲品的細緻、融合與流動性。</p></details><details><summary>⑤ 同一份濃縮加水，咖啡因總量增加？</summary><p>不增加。只是稀釋，濃度降低。</p></details>`,0],
['TAKE IT TO THE BAR','帶走三個觀念',`<div class="grid three"><div class="card"><h2>風味看條件</h2><p>豆種、產地與焙度都只是線索。</p></div><div class="card"><h2>參數是起點</h2><p>用配方練習，最後仍要試喝。</p></div><div class="card"><h2>調整留紀錄</h2><p>一次改一個變因，才方便比較。</p></div></div><p style="margin-top:24px"><a href="wiki/index.html">開啟五篇 Wiki 目錄</a> · <a href="sources.html">逐頁來源附錄</a> · <a href="workflow.html">製作 graph 與檢查紀錄</a></p><div class="note">本簡報來自五篇 Wiki。吧台情境為虛構教學，參數非所有產品通用標準，未聲稱咖啡實機測試。</div>`,0]
];
const refs=['','coffee-beans','coffee-roasting','espresso','milk','coffee-faq'];
const deck=document.getElementById('deck');
lessons.forEach(([label,title,body,ref],i)=>{const section=document.createElement('section');section.className='slide';section.id='slide-'+(i+1);section.setAttribute('aria-label',`第 ${i+1} 頁：${title}`);section.innerHTML=`<p class="eyebrow">${label}</p><h1>${title}</h1><div>${body}</div><p class="source">公主的女僕咖啡教室 · ${ref?`依據：<a href="wiki/${refs[ref]}.html">Wiki 0${ref}</a>`:'依據：五篇 Wiki 教學整合'} · <a href="sources.html">來源對照</a></p>`;deck.append(section)});
let current=0;const prev=document.getElementById('prev'),next=document.getElementById('next'),jump=document.getElementById('jump');jump.max=lessons.length;
function show(n,hash=true){current=Math.max(0,Math.min(lessons.length-1,n));document.querySelectorAll('.slide').forEach((s,i)=>{s.classList.toggle('active',i===current);s.setAttribute('aria-hidden',String(i!==current))});document.getElementById('count').textContent=`${String(current+1).padStart(2,'0')} / ${lessons.length}`;jump.value=current+1;prev.disabled=current===0;next.disabled=current===lessons.length-1;if(hash)history.replaceState(null,'','#'+(current+1));window.scrollTo(0,0)}
prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);jump.oninput=()=>show(Number(jump.value)-1);document.getElementById('print').onclick=()=>window.print();
document.addEventListener('keydown',e=>{if(['INPUT','SUMMARY','A'].includes(document.activeElement.tagName))return;if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(lessons.length-1)});
window.addEventListener('hashchange',()=>show((parseInt(location.hash.slice(1))||1)-1,false));show((parseInt(location.hash.slice(1))||1)-1);
let savedDetails=[];window.addEventListener('beforeprint',()=>{savedDetails=[...document.querySelectorAll('details')].map(d=>d.open);document.querySelectorAll('details').forEach(d=>d.open=true)});window.addEventListener('afterprint',()=>document.querySelectorAll('details').forEach((d,i)=>d.open=savedDetails[i]));


</script></body></html>
